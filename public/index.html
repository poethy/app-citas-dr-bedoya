<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- maximum-scale=1 evita que el navegador del celular haga zoom al tocar un campo -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#0b1f3a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Citas Dr. Bedoya" />
    <meta
      name="description"
      content="Agenda, reprograma o cancela tus citas con el Dr. Camilo Bedoya."
    />
    <title>Citas Dr. Camilo Bedoya</title>
    <!-- Ícono y nombre al «Agregar a pantalla de inicio» (iPhone y Android) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style id="expo-reset">
      /* La app ocupa la pantalla completa; dvh descuenta la barra del navegador del celular */
      html,
      body {
        height: 100%;
        background-color: #0b1f3a;
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      #root {
        display: flex;
        height: 100%;
        height: 100dvh;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <noscript>Activa JavaScript para usar la app.</noscript>
    <div id="root"></div>
  </body>
</html>
